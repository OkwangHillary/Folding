<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>artworld iivvi</title>
    <meta name="description" content="An experiemntal 3D layout technique for HTML elements." />
    <meta name="keywords" content="3d, layout, html, css, bending, javascript, demo" />
    <meta name="author" content="Codrops" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="stylesheet" href="https://use.typekit.net/xsl0wab.css">
    <link rel="stylesheet" type="text/css" href="css/base.css" />
    <link rel="stylesheet" type="text/css" href="css/horizontal.css" />
    <script>
    document.documentElement.className = "js";
    var supportsCssVars = function() {
        var e,
            t = document.createElement("style");
        return (
            (t.innerHTML = "root: { --tmp-var: bold; }"),
            document.head.appendChild(t),
            (e = !!(
                window.CSS &&
                window.CSS.supports &&
                window.CSS.supports("font-weight", "var(--tmp-var)")
            )),
            t.parentNode.removeChild(t),
            e
        );
    };
    supportsCssVars() ||
        alert(
            "Please view this demo in a modern browser that supports CSS Variables."
        );
    </script>
</head>

<body class="demo-5 loading">
    <main>
        <div class="message">Some message for mobile (if needed).</div>
        <div class="frame">
            <h1 class="frame__title">iivvi</h1>
            <div class="frame__heading-wrap">
                <h2 class="frame__heading">art &mdash; world</h2>
                <time datetime="2020-03-01">by hillaryokwang</time>
            </div>
            <div class="frame__links">
                <a href="https://instagram.com/artworldug">Instagram</a>
            </div>
            <div class="frame__demos">
                <a href="#" class="frame__demo">**</a>
                <a href="index.html" class="frame__demo frame__demo--current">iivvidesigns</a>
            </div>
        </div>
        <div class="content">
            <div class="fold-content" id="base-content">
                <img class="content__img" src="img/1.png" alt="Some image" />
                <h3 class="content__title">Landscape</h3>
                <img class="content__img" src="img/2.png" alt="Some image" />
                <h3 class="content__title">Africa</h3>
                <img class="content__img" src="img/3.png" alt="Some image" />
                <h3 class="content__title">Teddy Abele</h3>
                <img class="content__img" src="img/4.png" alt="Some image" />
                <h3 class="content__title">Be still</h3>
                <img class="content__img" src="img/5.png" alt="Some image" />
                <h3 class="content__title">Leaves</h3>
                <img class="content__img" src="img/6.png" alt="Some image" />
                <h3 class="content__title">Form</h3>
                <img class="content__img" src="img/7.png" alt="Some image" />
                <h3 class="content__title">Family</h3>
                <img class="content__img" src="img/8.png" alt="Some image" />
                <h3 class="content__title">I'm Lord</h3>
                <img class="content__img" src="img/9.png" alt="Some image" />
                <h3 class="content__title">Life</h3>
            </div>
            <div class="screen" id="fold-effect">
                <div class="wrapper-3d">
                    <div class="fold fold-before fold-before-3"></div>
                    <div class="fold fold-before fold-before-2"></div>
                    <div class="fold fold-before fold-before-1"></div>
                    <div class="fold fold-main"></div>
                </div>
            </div>
        </div>
    </main>
    <script src="./js/imagesloaded.pkgd.min.js"></script>
    <script src="./js/horizontal.js"></script>
</body>

</html>
